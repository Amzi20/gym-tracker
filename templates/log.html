{% extends "base.html" %}
{% block content %}
<h1>Log a workout</h1>
<form method="post">
  <label>Date <input type="date" name="date" value="{{ today }}" required></label>
  <label>Duration (minutes) <input type="number" name="duration" min="1" required></label>
  <h3>Exercises</h3>
  {% for i in range(6) %}
  <div>
    <input name="name" placeholder="Exercise">
    <input type="number" name="sets" placeholder="Sets" min="1" style="width:5rem">
    <input type="number" name="reps" placeholder="Reps" min="1" style="width:5rem">
    <input type="number" name="weight" placeholder="kg" step="0.5" min="0" style="width:5rem">
  </div>
  {% endfor %}
  <button type="submit">Save workout</button>
</form>
{% endblock %}
